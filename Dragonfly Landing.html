<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dragonfly Landing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap">
<style>
  /* Layout: one fixed screen. An oversized heptagon lattice bleeds off every edge as a faint
     ground; the dragonfly mark is drawn on top, centred; a single quiet line of text sits below. */
  :root {
    color-scheme: dark;
    --ground: #404040;
    --lattice: rgba(214, 220, 224, 0.075);
    --mark: #9fc615;
    --text: #b9bdb4;
    --text-dim: #8b8f87;
    --font: "Jost", "Century Gothic", "Avenir Next", system-ui, sans-serif;
    --hept-time: 3.4s;   /* when the lattice is finished and the dragonfly starts */
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: var(--font);
    font-weight: 300;
    overflow: hidden;
    position: relative;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .lattice {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .lattice line {
    stroke: var(--lattice); stroke-width: 1.4; fill: none;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  .stage {
    position: relative; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(20px, 5vh, 48px);
  }
  .mark { width: min(100%, 760px); max-height: 62vh; display: block; }
  .mark path {
    fill: none; stroke: var(--mark); stroke-width: 1.7;
    stroke-linejoin: miter; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  @media (max-width: 600px) { .mark path { stroke-width: 3; } .lattice line { stroke-width: 2; } }

  .note { text-align: center; opacity: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .note p {
    margin: 0; font-size: clamp(12px, 1.6vw, 15px);
    letter-spacing: 0.42em; text-indent: 0.42em; text-transform: uppercase;
  }
  .note .tag { color: var(--text-dim); font-size: clamp(11px, 1.3vw, 13px); }
  .replay {
    font: inherit; font-size: 11px; letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
    color: var(--text-dim); background: none; border: 0; padding: 8px 12px; cursor: pointer;
  }
  .replay:hover { color: var(--mark); }
  .replay:focus-visible { outline: 1px solid var(--mark); outline-offset: 2px; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes rise { to { opacity: 1; } }

  .play .lattice line { animation: draw 1.5s cubic-bezier(.5,0,.2,1) forwards; animation-delay: var(--d); }
  .play .mark path   { animation: draw var(--t, 1.4s) cubic-bezier(.6,0,.2,1) forwards; animation-delay: calc(var(--hept-time) + var(--d)); }
  .play .note        { animation: rise 1.2s ease forwards; animation-delay: calc(var(--hept-time) + 3.6s); }

  @media (prefers-reduced-motion: reduce) {
    .lattice line, .mark path { stroke-dashoffset: 0; animation: none !important; }
    .note { opacity: 1; animation: none !important; }
    .replay { display: none; }
  }
</style>

<svg class="lattice" id="lattice" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<main class="stage">
  <svg class="mark" viewBox="206 232 880 606" role="img" aria-label="Dragonfly">
    <!-- body: tail, crossing up through the head and back, one continuous line -->
    <path pathLength="1" style="--d:0s;--t:2.2s" d="M628 410 L664 783 L646 818 L628 783 L664 410 L628 305 L646 287 L664 305 Z"/>
    <!-- thorax -->
    <path pathLength="1" style="--d:1.5s;--t:1s" d="M646 375 L664 410 L646 500 L628 410 Z"/>
    <!-- upper wings -->
    <path pathLength="1" style="--d:2s" d="M628 410 L398 252 L240 252 L380 358 Z"/>
    <path pathLength="1" style="--d:2s" d="M664 410 L894 252 L1052 252 L912 358 Z"/>
    <!-- lower wings -->
    <path pathLength="1" style="--d:2.5s" d="M628 410 L398 367 L292 410 L416 446 Z"/>
    <path pathLength="1" style="--d:2.5s" d="M664 410 L894 367 L1000 410 L876 446 Z"/>
  </svg>

  <div class="note">
    <p>Dragonfly Ind.</p>
    <p class="tag">Just Making Things</p>
  </div>
</main>

<script>
  (function () {
    var svg = document.getElementById('lattice');
    var NS = 'http://www.w3.org/2000/svg';
    var R = 300, EXT = 2400, n = 7, pts = [], i, order = 0;
    for (i = 0; i < n; i++) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      pts.push([R * Math.cos(a), R * Math.sin(a)]);
    }
    // Every vertex joined to every other (sides, then the two families of diagonals),
    // each line run far past its vertices so the figure spills off the screen.
    for (var step = 1; step <= 3; step++) {
      for (i = 0; i < n; i++) {
        var p = pts[i], q = pts[(i + step) % n];
        var dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        var l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', p[0] - dx * EXT); l.setAttribute('y1', p[1] - dy * EXT);
        l.setAttribute('x2', q[0] + dx * EXT); l.setAttribute('y2', q[1] + dy * EXT);
        l.setAttribute('pathLength', '1');
        l.style.setProperty('--d', (order++ * 0.09).toFixed(2) + 's');
        svg.appendChild(l);
      }
    }
    function play() {
      document.body.classList.remove('play');
      void document.body.offsetWidth;
      document.body.classList.add('play');
    }
    play();
  })();
</script>

</body></html>
